name: family_app
description: "تطبيق جمعية العائلة — إدارة العائلات والاشتراكات والصندوق"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State. AsyncValue models loading/error/data as one sealed type, so every
  # screen's three required states fall out of a single .when().
  flutter_riverpod: ^2.6.1

  # Routing with a redirect guard, so auth/approval/role checks are evaluated
  # on every navigation and no stale deep link can outlive a demotion.
  go_router: ^17.4.0

  # HTTP with interceptors: bearer injection and single-flight 401 refresh.

  # NOTE: 7.x replaced the 6.x `signIn()` API with
  # GoogleSignIn.instance.initialize() + authenticate(). Most tutorials online
  # still show 6.x and will not compile against this.
  google_sign_in: ^7.2.0

  # Direct dependency so web_only.dart (Google's rendered button) can be
  # imported behind a conditional import. On web, supportsAuthenticate() is
  # false and the button is the ONLY way to start a sign-in.
  google_sign_in_web: ^1.1.3

  # Keystore / Keychain for the refresh token. The access token stays in memory.
  flutter_secure_storage: ^11.0.0

  # Pinned, not ^: flutter_localizations from the SDK depends on exactly 0.20.2
  # and a caret range resolves higher, which fails version solving.
  intl: 0.20.2
  supabase_flutter: ^2.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Generates AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true

  fonts:
    # Tajawal for display, Cairo for body.
    #
    # Tajawal ships STATIC instances, so each weight is its own file and the
    # `weight:` keys below are what let TextStyle.fontWeight pick the right one.
    # Cairo is a variable font declared once — Flutter drives its `wght` axis
    # from fontWeight directly. test/design_system_test.dart proves both work by
    # measuring glyph advance at w400 against w800, because a mis-declared font
    # silently renders every weight at regular and nothing looks broken.
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
