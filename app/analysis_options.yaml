include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "build/**"
    - "lib/l10n/app_localizations*.dart"
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    # RTL correctness cannot be fully expressed as a lint rule, so the
    # directional-padding and hard-coded-Arabic checks live in
    # tool/rtl_lint.dart, which runs alongside `flutter analyze`.
    - always_declare_return_types
    - avoid_empty_else
    - avoid_relative_lib_imports
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_parenthesis
    - use_super_parameters
